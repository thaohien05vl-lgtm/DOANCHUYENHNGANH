<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E2A2D" />
    <title>Finora</title>
    <script>
      /* Áp chủ đề + ngôn ngữ ngay trước khi vẽ để màn hình khởi động đúng màu, không nháy sáng/tối. */
      (function () {
        try {
          var d = document.documentElement
          var id = localStorage.getItem('qlct-theme')
          var toi = ['dem', 'ho-phach', 'dai-duong', 'than', 'hoa-hong', 'rung-dem', 'thach-anh']
          if (!id) id = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dem' : 'ngoc'
          var laToi = toi.indexOf(id) !== -1
          d.dataset.theme = id
          d.dataset.themeMode = laToi ? 'dark' : 'light'
          d.style.setProperty('--boot-nen', laToi ? '#0b1718' : '#f1f6f3')
          var l = localStorage.getItem('qlct-ngon-ngu')
          if (l) d.lang = l
          var title = { vi: 'Finora — Quản lý tài chính cá nhân', en: 'Finora — Personal finance', ko: 'Finora — 개인 재무 관리', ja: 'Finora — 個人資産管理', zh: 'Finora — 个人理财' }
          if (title[l]) document.title = title[l]
        } catch (e) {}
      })()
    </script>
    <style>
      #boot { position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center; overflow: hidden;
        background: var(--nen, var(--boot-nen, #f1f6f3)); transition: opacity .36s ease, transform .36s ease; will-change: opacity, transform; }
      #boot.boot-out { opacity: 0; transform: scale(1.04); pointer-events: none; }
      #boot .boot-glow { position: absolute; width: 140vmax; height: 140vmax; left: 50%; top: 50%; margin: -70vmax 0 0 -70vmax;
        background: radial-gradient(closest-side, color-mix(in srgb, var(--ngoc, #14946f) 22%, transparent), transparent 70%);
        opacity: 0; transform: scale(.4); animation: boot-glow .9s .05s cubic-bezier(.2,.8,.2,1) forwards; }
      #boot .boot-hop { position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px; }
      #boot .boot-logo { width: 92px; height: 92px; opacity: 0; transform: scale(.55) rotate(-8deg);
        animation: boot-logo .62s .08s cubic-bezier(.2,1.1,.3,1) forwards; filter: drop-shadow(0 14px 22px rgb(0 0 0 / .22)); }
      #boot .boot-vong { transform-origin: 32px 32px; stroke-dasharray: 145; stroke-dashoffset: 145; animation: boot-ve .8s .25s ease-out forwards; }
      #boot .boot-chu { font: 800 1.7rem/1 'Be Vietnam Pro', system-ui, sans-serif; letter-spacing: -.03em; color: var(--chu, #12262b);
        opacity: 0; transform: translateY(10px); animation: boot-len .5s .38s ease-out forwards; }
      #boot .boot-thanh { width: 56px; height: 4px; border-radius: 4px; background: color-mix(in srgb, var(--ngoc, #14946f) 18%, transparent); overflow: hidden;
        opacity: 0; animation: boot-len .4s .5s ease-out forwards; }
      #boot .boot-thanh i { display: block; height: 100%; width: 45%; border-radius: 4px; background: var(--ngoc, #14946f);
        animation: boot-chay 1s .5s ease-in-out infinite; }
      @keyframes boot-glow { to { opacity: 1; transform: scale(1); } }
      @keyframes boot-logo { to { opacity: 1; transform: none; } }
      @keyframes boot-ve { to { stroke-dashoffset: 0; } }
      @keyframes boot-len { to { opacity: 1; transform: none; } }
      @keyframes boot-chay { from { transform: translateX(-100%); } to { transform: translateX(240%); } }
      @media (prefers-reduced-motion: reduce) { #boot * { animation-duration: .01s !important; animation-delay: 0s !important; } }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="boot-glow"></div>
      <div class="boot-hop">
        <svg class="boot-logo" viewBox="0 0 64 64">
          <defs><linearGradient id="bootg" x1="10" y1="8" x2="56" y2="58" gradientUnits="userSpaceOnUse"><stop stop-color="#24564b" /><stop offset="1" stop-color="#143b32" /></linearGradient></defs>
          <rect width="64" height="64" rx="19" fill="url(#bootg)" />
          <circle class="boot-vong" cx="32" cy="32" r="23" fill="none" stroke="#2fc39a" stroke-opacity=".7" stroke-width="1.6" stroke-linecap="round" />
          <path d="M21 45V19h23v6H28v6h13v6H28v8h-7Z" fill="#fff" />
          <circle cx="39" cy="41.5" r="5.5" fill="#2fc39a" stroke="#143b32" stroke-width="2" />
          <path d="m36.7 41.6 1.6 1.6 3.2-3.5" fill="none" stroke="#143b32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <div class="boot-chu">Finora</div>
        <div class="boot-thanh"><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
